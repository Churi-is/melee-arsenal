[project]
name = "melee-arsenal"
version = "0.4.6"
description = "Borderlands 2 PythonSDK mod and Unreal Engine 3 asset pipeline"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["Pillow==13.0.0"]
authors = [{ name = "MeleeArsenal" }]

[project.urls]
Homepage = "https://github.com/Churi-is/melee-arsenal"
Repository = "https://github.com/Churi-is/melee-arsenal"
Issues = "https://github.com/Churi-is/melee-arsenal/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "build", "tools/inkblade_upk/donors"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tools/inkblade_gen/stages.py" = ["B023"]  # callbacks are invoked immediately inside the loop
"tools/inkblade_gen/textures.py" = ["B023"]
